version: '3.8'

services:
  podcast-directory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: podcast-directory
    restart: unless-stopped
    ports:
      - "5174:3001"
    volumes:
      - podcast-data:/app/data
    env_file:
      - .env
    networks:
      - podcast-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  podcast-data:
    driver: local

networks:
  podcast-network:
    driver: bridge
