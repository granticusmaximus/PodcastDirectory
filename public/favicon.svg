<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="50" cy="50" r="48" fill="url(#grad)" />

    <!-- Microphone body -->
    <rect x="42" y="25" width="16" height="28" rx="8" fill="white" />

    <!-- Microphone grid lines -->
    <line x1="42" y1="35" x2="58" y2="35" stroke="#667eea" stroke-width="1.5" opacity="0.6" />
    <line x1="42" y1="40" x2="58" y2="40" stroke="#667eea" stroke-width="1.5" opacity="0.6" />
    <line x1="42" y1="45" x2="58" y2="45" stroke="#667eea" stroke-width="1.5" opacity="0.6" />

    <!-- Microphone stand arc -->
    <path d="M 35 53 Q 35 65 50 65 Q 65 65 65 53" stroke="white" stroke-width="3" fill="none" />

    <!-- Microphone stand vertical -->
    <line x1="50" y1="65" x2="50" y2="75" stroke="white" stroke-width="3" />

    <!-- Microphone base -->
    <line x1="42" y1="75" x2="58" y2="75" stroke="white" stroke-width="3" stroke-linecap="round" />

    <!-- Sound waves -->
    <path d="M 25 35 Q 20 45 25 55" stroke="white" stroke-width="2.5" fill="none" opacity="0.7"
        stroke-linecap="round" />
    <path d="M 75 35 Q 80 45 75 55" stroke="white" stroke-width="2.5" fill="none" opacity="0.7"
        stroke-linecap="round" />
    <path d="M 18 30 Q 12 45 18 60" stroke="white" stroke-width="2" fill="none" opacity="0.5"
        stroke-linecap="round" />
    <path d="M 82 30 Q 88 45 82 60" stroke="white" stroke-width="2" fill="none" opacity="0.5"
        stroke-linecap="round" />
</svg>